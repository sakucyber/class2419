    <noscript>
      <div style="padding: 24px; font-family: system-ui, sans-serif">
        本班级空间需要启用 JavaScript 才能浏览，谢谢！
      </div>
    </noscript>

    <!--
      脚本顺序有讲究，别调：

      1) type="module" 放在最前 —— 这样 public/compat.js 执行时它已经存在于 DOM，
         判定为「不支持」的浏览器可以直接摘掉标签（module 是 deferred 的，此刻尚未执行，
         摘掉即阻止执行），并撤掉 modulepreload 避免白下载。
         顺序反过来的话，compat.js 运行时标签还没被解析出来，就摘不掉了。

      2) probe-es2020.js 必须在 compat.js 之前 —— compat.js 要读它写的
         window.__modernSyntax 判断语法能力（用「标志位在不在」代替 eval，
         因为 CSP `script-src 'self'` 会拦截 new Function）。

      3) 两个脚本都放 public/ 下，构建时原样复制、不做降级转译：
         它们必须保持 ES5，否则老浏览器连升级提示页都跑不出来。

      4) 页面里不再内置降级页 DOM —— 判定为 unsupported 时由 compat.js
         用 document.body.innerHTML 整体替换，走「不加载主包」的路径。
    -->
    <script type="module" src="/src/main.ts"></script>
    <script src="/probe-es2020.js"></script>
    <script src="/compat.js"></script>
  </body>
